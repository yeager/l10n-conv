name: Build RPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' src/l10n_conv/__init__.py)" >> $GITHUB_OUTPUT

      - name: Setup RPM build
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          VERSION=${{ steps.version.outputs.version }}
          DIR=l10n-conv-$VERSION
          mkdir -p $DIR/{l10n_conv,data/man}
          cp src/l10n_conv/*.py $DIR/l10n_conv/
          cp data/man/l10n-conv.1 $DIR/data/man/
          cp LICENSE $DIR/
          tar czf ~/rpmbuild/SOURCES/$DIR.tar.gz $DIR

      - name: Create spec file
        run: |
          cat > ~/rpmbuild/SPECS/l10n-conv.spec << 'SPEC'
          Name:           l10n-conv
          Version:        VERSION_PLACEHOLDER
          Release:        1
          Summary:        Universal localization file converter, validator, and compiler
          License:        GPL-3.0-or-later
          URL:            https://github.com/yeager/l10n-conv
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      noarch
          Requires:       python3 >= 3.9
          Requires:       python3-click
          Requires:       python3-polib
          Requires:       python3-babel
          Requires:       python3-lxml
          Requires:       python3-rich
          Requires:       python3-pyyaml
          Requires:       python3-ruamel-yaml

          %description
          A CLI tool for converting, validating, and compiling localization files.
          Supports PO, XLIFF, JSON, YAML, and other translation formats.

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}%{_datadir}/l10n-conv/l10n_conv
          cp l10n_conv/*.py %{buildroot}%{_datadir}/l10n-conv/l10n_conv/

          mkdir -p %{buildroot}%{_bindir}
          cat > %{buildroot}%{_bindir}/l10n-conv << 'LAUNCHER'
          #!/bin/bash
          exec python3 -c "import sys; sys.path.insert(0, '/usr/share/l10n-conv'); from l10n_conv.cli import main; main()" "$@"
          LAUNCHER
          chmod 755 %{buildroot}%{_bindir}/l10n-conv

          mkdir -p %{buildroot}%{_mandir}/man1
          cp data/man/l10n-conv.1 %{buildroot}%{_mandir}/man1/

          %files
          %license LICENSE
          %{_bindir}/l10n-conv
          %{_datadir}/l10n-conv/l10n_conv/__init__.py
          %{_datadir}/l10n-conv/l10n_conv/checker.py
          %{_datadir}/l10n-conv/l10n_conv/cli.py
          %{_datadir}/l10n-conv/l10n_conv/extractor.py
          %{_datadir}/l10n-conv/l10n_conv/model.py
          %{_datadir}/l10n-conv/l10n_conv/registry.py
          %{_mandir}/man1/l10n-conv.1*
          SPEC
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/" ~/rpmbuild/SPECS/l10n-conv.spec

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/l10n-conv.spec

      - name: Upload RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release upload "v$VERSION" \
            ~/rpmbuild/RPMS/noarch/l10n-conv-${VERSION}-1.noarch.rpm \
            --clobber
